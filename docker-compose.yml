# Geliştirme altyapısı. Servislerin kendisi değil, kullandıkları veritabanları, mesaj kuyrukları ve log aracı.
# Başlat: docker compose up -d   Durdur: docker compose down   (veri volume'larda kalır)
# Ağır iki araç (Elasticsearch, Kafka) "extra" profilinde: docker compose --profile extra up -d
# Onlar kapalıyken servisler çalışmaya devam eder (doktor araması MongoDB'ye düşer, etkinlik akışı yazılmaz).
# Şifreler .env dosyasından gelir (.env.example'ı kopyala).

name: hastane

services:
  mongo:
    image: mongo:8.0
    container_name: hastane-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hastane-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  mariadb:
    image: mariadb:11.4
    container_name: hastane-mariadb
    ports:
      - "3307:3306"   # bilgisayarda 3306 başka bir MySQL tarafından kullanılıyor olabilir
    # Türkçe karakterler için sunucu varsayılanı utf8mb4 (yoksa yeni tablolar latin1 açılabilir).
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7.4
    container_name: hastane-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: hastane-rabbitmq
    ports:
      - "5672:5672"     # AMQP (servisler)
      - "15672:15672"   # yönetim arayüzü: http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0   # testlerle aynı sürüm
    container_name: hastane-elasticsearch
    profiles: ["extra"]
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # yalnız yerel geliştirme
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.1
    container_name: hastane-kafka
    profiles: ["extra"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: hastane-seq
    ports:
      - "5341:80"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"   # yalnız yerel geliştirme
    volumes:
      - seq-data:/data
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: hastane-mailhog
    ports:
      - "1025:1025"   # SMTP (servislerin e-posta gönderdiği yer)
      - "8025:8025"   # web arayüzü: http://localhost:8025 (yakalanan e-postaları gör)
    restart: unless-stopped

volumes:
  mongo-data:
  sqlserver-data:
  mariadb-data:
  redis-data:
  rabbitmq-data:
  elastic-data:
  kafka-data:
  seq-data:
